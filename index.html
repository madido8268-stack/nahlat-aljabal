<!-- هذا هو الكود المعدل، بدل بيه الجزء القديم في ملف index.html ديالك -->
<script>
    function sendToWhatsApp(event) {
        event.preventDefault();
        
        // نجيبوا المعلومات من الفورم
        var name = document.getElementById('name').value;
        var phone = document.getElementById('phone').value;
        var address = document.getElementById('address').value;
        var city = document.getElementById('city').value; // زدنا خانة المدينة
        
        // النمرة ديال عمك
        var phoneNumber = "212671044864";
        
        // الرسالة الجديدة بالدارجة ومنظمة بالإيموجيات
        var message = "👋 السلام عليكم، بغيت نطلب عسل الدغموس الجبلي:\n\n" +
                      "📦 *تفاصيل الطلب*:\n" +
                      "🏷️ المنتج: عسل الدغموس الجبلي - كيلو واحد\n" +
                      "💰 الثمن: 200 درهم\n\n" +
                      "👤 *معلومات الزبون*:\n" +
                      "👤 الاسم: " + name + "\n" +
                      "📞 الهاتف: " + phone + "\n" +
                      "📍 العنوان: " + address + "\n" +
                      "🏙️ المدينة: " + city;
        
        // نفتحوا رابط الواتساب
        var url = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent(message);
        window.open(url, '_blank');
    }
</script>

<!-- وهادا هو كود الفورم (HTML) الجديد اللي خاصك تحطو باش تزيد خانة المدينة -->
<form id="orderForm" onsubmit="sendToWhatsApp(event)">
    <div class="form-group">
        <label>الاسم الكامل:</label>
        <input type="text" id="name" required placeholder="أدخل اسمك الكامل">
    </div>
    
    <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="phone" required placeholder="رقم الهاتف للتواصل">
    </div>
    
    <!-- العنوان بوحدو -->
    <div class="form-group">
        <label>العنوان (الزنقة والحي):</label>
        <input type="text" id="address" required placeholder="أدخل عنوان السكن">
    </div>

    <!-- المدينة بوحدها -->
    <div class="form-group">
        <label>المدينة:</label>
        <input type="text" id="city" required placeholder="أدخل اسم المدينة">
    </div>

    <button type="submit" class="btn-order">تأكيد الطلب عبر الواتساب</button>
</form>
